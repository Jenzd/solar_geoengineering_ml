[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-geoengineering-ml"
version = "0.1.0"
description = "Work-in-progress GeoMIP regional climate response and baseline ML research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "pandas>=1.5", "xarray>=2023.1", "scipy>=1.9", "scikit-learn>=1.2", "matplotlib>=3.6", "netCDF4>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyterlab>=4"]

[tool.setuptools.packages.find]
include = ["srm_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
